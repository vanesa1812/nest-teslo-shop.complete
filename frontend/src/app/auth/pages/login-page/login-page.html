
<form class=" flex flex-col gap-2"
[formGroup]="loginForm"
(ngSubmit)="onSubmit()"
>


<!-- Email -->
<label class="input input-bordered flex items-center gap-2">
  <svg
    xmlns="http://www.w3.org/2000/svg"
    viewBox="0 0 16 16"
    fill="currentColor"
    class="h-4 w-4 opacity-70"
  >
    <path
      d="M2.5 3A1.5 1.5 0 0 0 1 4.5v.793l6.674 3.217a.75.75 0 0 0 .652 0L15 5.293V4.5A1.5 1.5 0 0 0 13.5 3h-11Z"
    />
    <path
      d="M15 6.954 8.978 9.86a2.25 2.25 0 0 1-1.956 0L1 6.954V11.5A1.5 1.5 0 0 0 2.5 13h11a1.5 1.5 0 0 0 1.5-1.5V6.954Z"
    />
  </svg>

  <input type="text" class="grow" placeholder="Correo Electronico"
  formControlName="email"
  />
</label>

<!-- Password -->
<label class="input input-bordered flex items-center gap-2">
  <svg
    xmlns="http://www.w3.org/2000/svg"
    viewBox="0 0 16 16"
    fill="currentColor"
    class="h-4 w-4 opacity-70"
  >
    <path
      fill-rule="evenodd"
      d="M14 6a4 4 0 0 1-4.899 3.899l-1.955 1.955a.5.5 0 0 1-.353.146H5.5v1.5a.5.5 0 0 1-.5.5H3.5v1.5h-2v-3.5a.5.5 0 0 1 .146-.354l5.955-5.955A4 4 0 1 1 14 6Zm-4-1.5a1 1 0 1 0 2 0 1 1 0 0 0-2 0Z"
      clip-rule="evenodd"
    />
  </svg>

  <input
  type="password"
  class="grow"
  placeholder="Contraseña"
  formControlName="password"
  />

</label>


<button type="submit" class="btn btn-success">
  Login
</button>

<p class="text-slate-700">
  No tienes cuenta
  <a routerLink="/auth/register" class="text-secondary">Crea una aqui</a>
</p>

</form>

@if(hasError()){
<div role="alert" class="alert alert-error animate-fadeIn fixed bottom-5 right-5 w-52 ">
  <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 shrink-0 stroke-current" fill="none" viewBox="0 0 24 24">
    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2m7-2a9 9 0 11-18 0 9 9 0 0118 0z" />
  </svg>
  <span>Porfavor verifique la informacion.</span>
</div>
}
